name: DTO update

# Weekly update of the SDK's DTOs to match python-genai:
#   - adds missing fields to existing types and missing values to existing enums,
#   - marks fields that python-genai removed as [Obsolete],
#   - generates a new DTO class/enum only when a newly added field needs it.
# The code is generated deterministically by scripts/drift/update_dtos.py. If the ANTHROPIC_API_KEY secret is set,
# Claude Haiku reviews the proposals first: it can leave out Python-only ones, writes the XML doc summaries and the
# summary (scripts/drift/dto_review.py). Without the secret every proposal is kept.
# It never adds client methods or features.
#
# Flow when there are changes:
#   1. Open (or update) the issue "[Drift] DTO update from python-genai" listing the changes.
#   2. Build (0 warnings) and run the tests.
#   3. If both pass, open (or update) a pull request from "drift/dto-update" that closes the issue.
#      If not, comment on the issue with the build or test output; no pull request is opened.
#
# Requires: Settings -> Actions -> General -> Workflow permissions ->
#           "Allow GitHub Actions to create and approve pull requests".

on:
  schedule:
    - cron: "0 7 * * 1"   # Mondays, 07:00 UTC (an hour after the API drift check)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: dto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      BRANCH: drift/dto-update
      ISSUE_TITLE: "[Drift] DTO update from python-genai"
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Anthropic SDK
        run: python -m pip install --quiet "anthropic>=1,<2"

      - name: Generate DTO changes
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/drift/update_dtos.py --apply --report pr-body.md --issue-report issue-body.md

      - name: Open or update the issue
        id: issue
        if: steps.generate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create api-drift --color D93F0B --description "SDK is behind a Google API change" --force >/dev/null
          { cat issue-body.md; echo; echo "_[Workflow run]($RUN_URL)_"; } > issue.md
          number=$(gh issue list --state open --label api-drift --search "\"$ISSUE_TITLE\" in:title" --json number,title \
            --jq ".[] | select(.title == env.ISSUE_TITLE) | .number" | head -n 1)
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file issue.md
            echo "Updated issue #$number"
          else
            url=$(gh issue create --title "$ISSUE_TITLE" --label api-drift --body-file issue.md)
            number="${url##*/}"
            echo "Created issue #$number"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        if: steps.generate.outputs.changed == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x

      - name: Build (must have 0 warnings)
        id: build
        if: steps.generate.outputs.changed == 'true'
        run: |
          dotnet restore
          dotnet build --no-restore 2>&1 | tee build.log
          if grep -qE "[1-9][0-9]* Warning\(s\)|[1-9][0-9]* Error\(s\)" build.log; then
            echo "Build produced warnings or errors."
            exit 1
          fi

      - name: Test
        id: test
        if: steps.generate.outputs.changed == 'true'
        run: dotnet test --no-build --verbosity Minimal 2>&1 | tee test.log; exit ${PIPESTATUS[0]}

      - name: Refresh the DTO drift baseline
        if: steps.generate.outputs.changed == 'true'
        run: python scripts/drift/check_drift.py dto --update

      - name: Open or update the pull request
        if: steps.generate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ steps.issue.outputs.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add src .github/drift
          git commit -m "feat: update DTOs from python-genai (automated)"
          git push --force origin "$BRANCH"
          {
            echo "Closes #$ISSUE"
            echo
            cat pr-body.md
            echo
            echo "---"
            echo "Build: 0 warnings, 0 errors. Tests: passed. Review the generated code before merging."
            echo "_Generated by the [DTO update workflow]($RUN_URL)._"
          } > body.md
          number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh pr edit "$number" --body-file body.md
            echo "Updated pull request #$number"
          else
            gh pr create --base main --head "$BRANCH" --label api-drift \
              --title "feat: update DTOs from python-genai (automated)" --body-file body.md
          fi
          gh issue comment "$ISSUE" --body "The build and tests passed; the pull request from \`$BRANCH\` closes this issue when merged."

      - name: Report a failed update on the issue
        if: failure() && steps.issue.outputs.number != '' && (steps.build.outcome == 'failure' || steps.test.outcome == 'failure')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ steps.issue.outputs.number }}
        run: |
          {
            echo "The automated DTO update did not open a pull request: the generated code did not build cleanly or the"
            echo "tests failed. These changes need a person."
            echo
            echo "### Build output (last 60 lines)"
            echo '```'
            tail -n 60 build.log 2>/dev/null
            echo '```'
            if [ -f test.log ]; then
              echo "### Test output (last 60 lines)"
              echo '```'
              tail -n 60 test.log
              echo '```'
            fi
            echo
            echo "_[Workflow run]($RUN_URL)_"
          } > failure.md
          gh issue comment "$ISSUE" --body-file failure.md
