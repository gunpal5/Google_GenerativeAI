name: Publish Nuget Packages
on:
  workflow_dispatch:

jobs:
  build-test-publish:
    name: Build, Test & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write   # NuGet trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x

      - name: Get current version
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/GenerativeAI/GenerativeAI.csproj | head -1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal
        continue-on-error: true

      - name: Pack core library projects
        run: |
          dotnet pack src/GenerativeAI/GenerativeAI.csproj -c Release --no-build -o ./nupkgs
          dotnet pack src/GenerativeAI.Auth/GenerativeAI.Auth.csproj -c Release --no-build -o ./nupkgs
          dotnet pack src/GenerativeAI.Live/GenerativeAI.Live.csproj -c Release --no-build -o ./nupkgs
          dotnet pack src/GenerativeAI.Microsoft/GenerativeAI.Microsoft.csproj -c Release --no-build -o ./nupkgs
          dotnet pack src/GenerativeAI.Tools/GenerativeAI.Tools.csproj -c Release --no-build -o ./nupkgs
          dotnet pack src/GenerativeAI.Web/GenerativeAI.Web.csproj -c Release --no-build -o ./nupkgs

      # Trusted publishing: exchanges GitHub's OIDC token for a short-lived (1 hour) nuget.org API key.
      # Requires the nuget.org trusted publishing policy for gunpal5/Google_GenerativeAI, workflow main.yml.
      - name: NuGet login (OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER || 'gunpal5' }}

      - name: Publish to NuGet.org
        run: dotnet nuget push "./nupkgs/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate

      - name: Publish to GitHub Packages
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/gunpal5/index.json" --name github --username gunpal5 --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text
          dotnet nuget push "./nupkgs/*.nupkg" --source github --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate

      - name: Check for existing GitHub release
        id: release-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # Leave hand-written releases (created before publishing) untouched.
      - name: Create GitHub Release
        if: steps.release-check.outputs.exists != 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version for next release
        id: bump
        uses: vers-one/dotnet-project-version-updater@v1.7
        with:
          file: |
            "**/*.csproj", "**/*.nuspec", "**/AssemblyInfo.cs"
          version: bump-build

      - name: Commit version bump
        run: |
          git config user.name "Gunpal Jain"
          git config user.email "gunpal5@gmail.com"
          git add .
          git commit -m "Bump version to v${{ steps.bump.outputs.newVersion }}"
          git push
